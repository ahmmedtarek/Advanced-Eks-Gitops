apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-readonly
  namespace: app
rules:
- apiGroups:
  - ""
  resources:
    - pods
    - pods/log
    - services
    - endpoints
    - events
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
    - deployments
    - replicasets
    - statefulsets
  verbs:
  - get
  - list
  - watch